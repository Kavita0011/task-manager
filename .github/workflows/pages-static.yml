# .github/workflows/pages-static.yml
name: Deploy static site (no Jekyll)

on:
  push:
    branches: [ main ]          # or whatever branch you publish
  workflow_dispatch:            # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------
  # Build / copy step – creates the folder GitHub Pages will publish
  # -------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gather files for publishing
        run: |
          # create the folder that Pages expects
          mkdir -p _site

          # copy everything you want to be publicly reachable
          # (your source folder is resources/views/tasks/)
          cp -R resources/views/tasks/* _site/

          # if you still have an index.php, rename it so browsers treat it as the home page
          if [ -f "_site/index.php" ]; then
            mv "_site/index.php" "_site/index.html"
          fi

          # add this file to disable Jekyll (important if you have any folder starting with "_")
          touch _site/.nojekyll

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # -------------------------------------------------
  # Deploy step – publishes the artifact to GitHub Pages
  # -------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
